# Application Configuration
baseUrl=https://www.saucedemo.com
browser=chrome
headless=false
implicitWait=10
environment=qa

# Multi-Website Configuration (for parallel testing)
website1.url=https://www.saucedemo.com
website2.url=https://www.automationexercise.com
website3.url=https://www.shop.demoqa.com
website4.url=https://www.magento.com

# Default website (used when no website parameter provided)
default.website=website1

# Timeout Configuration
explicitWait=30
pageLoadTimeout=30

# Screenshot Configuration
screenshotOnFailure=true
screenshotPath=./screenshots/

# Report Configuration
reportPath=./reports/
reportName=TestAutomationReport